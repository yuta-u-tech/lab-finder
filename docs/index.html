<title>研究室さがし</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 左に検索と絞り込み，右に一致度順の研究室リスト．狭い幅では縦積み． */
:root{
  --paper:#EEF2F4;
  --surface:#FAFCFC;
  --ink:#14232B;
  --muted:#5B6D76;
  --line:#CFD9DE;
  --accent:#0B6E6A;
  --accent-soft:#D5ECE9;
  --mark:#FFE08A;
  --warn:#8A5A00;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#0E1A20;--surface:#15252D;--ink:#E3EEF1;--muted:#8DA3AD;--line:#27404B;
  --accent:#5FD0C8;--accent-soft:#17403F;--mark:#6B5611;--warn:#E5B454;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0E1A20;--surface:#15252D;--ink:#E3EEF1;--muted:#8DA3AD;--line:#27404B;
  --accent:#5FD0C8;--accent-soft:#17403F;--mark:#6B5611;--warn:#E5B454;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.7 var(--body);padding-inline:clamp(16px,4vw,48px)}
.wrap{max-width:1120px;margin-inline:auto;padding-block:32px 64px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;padding-bottom:20px;border-bottom:2px solid var(--ink)}
h1{margin:0;font:800 clamp(28px,5vw,40px)/1.2 var(--display);letter-spacing:.04em}
.sub{margin:0;color:var(--muted);font-size:14px}
.notice{margin:16px 0 0;padding:10px 14px;border:1px dashed var(--warn);color:var(--warn);font-size:13px}
main{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:40px;margin-top:28px;align-items:start}
@media(max-width:820px){main{grid-template-columns:minmax(0,1fr);gap:28px}}
aside{display:flex;flex-direction:column;gap:20px;position:sticky;top:16px}
@media(max-width:820px){aside{position:static}}
label,.lab{font:500 12px var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:6px}
textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:10px 12px}
textarea{min-height:104px;resize:vertical}
:is(textarea,select,button,summary):focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;color:var(--accent);background:var(--accent-soft);border:0;border-radius:99px;padding:3px 12px;cursor:pointer}
.chip:hover{text-decoration:underline}
.hint{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
.count{font:500 13px var(--mono);color:var(--muted);margin:0 0 12px;font-variant-numeric:tabular-nums}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lab-item{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 18px;padding:20px 0;border-top:1px solid var(--line)}
.lab-item:first-child{border-top:2px solid var(--ink)}
.score{font:500 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.score b{display:block;font:800 26px/1.1 var(--display);color:var(--accent)}
.bar{height:3px;background:var(--line);margin-top:6px}.bar i{display:block;height:100%;background:var(--accent)}
h2{margin:0;font:700 19px/1.4 var(--display)}
.meta{margin:2px 0 8px;font-size:13px;color:var(--muted)}
.theme{margin:0 0 8px}
.tags{display:flex;flex-wrap:wrap;gap:4px 6px;margin:0 0 10px;padding:0;list-style:none}
.tags li{font:400 12px var(--mono);border:1px solid var(--line);padding:0 8px;border-radius:2px;color:var(--muted)}
.tags li.hit{background:var(--mark);color:var(--ink);border-color:transparent}
.why{font-size:13px;color:var(--accent);margin:0 0 8px}
.warn{font-size:13px;color:var(--warn);margin:0 0 8px}
.links{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;margin:0}
a{color:var(--accent)}
.adm{margin:8px 0 0;font-size:13px}
.adm summary{cursor:pointer;color:var(--accent);font-weight:500}
.adm dl{margin:8px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px}
.adm dt{color:var(--muted)}.adm dd{margin:0}
.empty{padding:32px 0;color:var(--muted)}
.more{margin-top:16px;font:inherit;font-weight:700;color:var(--accent);background:var(--surface);border:1px solid var(--accent);border-radius:3px;padding:8px 20px;cursor:pointer}
.foot{margin-top:40px;border-top:1px solid var(--line);padding-top:16px;font-size:13px;color:var(--muted)}
@media(max-width:480px){.lab-item{grid-template-columns:minmax(0,1fr)}.score b{display:inline;margin-right:8px}}
</style>

<div class="wrap">
  <header>
    <h1>研究室さがし</h1>
    <p class="sub">学びたいこと，気になることを書くと，近い研究室を一致度順に並べます．</p>
  </header>
  <p class="notice">各大学の公式サイトから機械的に集めたデータです．確認日は研究室ごとに表示しています．出願前に必ず各大学の募集要項と研究室の公式ページで確認してください．</p>

  <main>
    <aside>
      <div>
        <label for="q">学びたいこと・興味</label>
        <textarea id="q" placeholder="例：脳の仕組みをモデル化したい，機械学習で医療に貢献したい"></textarea>
        <p class="hint">単語を区切って書くと精度が上がります．</p>
      </div>
      <div>
        <span class="lab">例から試す</span>
        <div class="chips" id="ex"></div>
      </div>
      <div>
        <label for="univ">大学</label>
        <select id="univ"></select>
      </div>
      <div>
        <label for="dept">専攻・コース</label>
        <select id="dept"></select>
      </div>
    </aside>

    <section aria-live="polite">
      <p class="count" id="count"></p>
      <ol id="list"></ol>
      <button type="button" class="more" id="more" hidden>さらに表示</button>
      <p class="foot">対象は東京理科大(工学部 情報工学科)，東京科学大，東京大，京都大，大阪大，筑波大，名古屋大，横浜国立大の情報・数理系です．大学によって研究室の単位が違い，講座名や教員単位で載せているものがあります．</p>
    </section>
  </main>
</div>

"大学院の指導教員一覧に掲載．学科の研究室一覧には載っていない．","c":"2026-10-06"},{"u":"東京理科大学","d":"工学研究科 情報工学専攻(工学部 情報工学科)","n":"渡邉研究室","p":"渡邉均(教授)","k":["通信網制御","ネットワーク安全性"],"t":"通信網制御，ネットワーク安全性を研究分野とする．","l":"https://www.tus.ac.jp/academics/graduate_school/engineering/information_computertecnology/","a":0,"w":"大学院の指導教員一覧に掲載．学科の研究室一覧には載っていない．","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"孫研究室","p":"孫鶴鳴(准教授)","k":["動画像圧縮","生成AIモデル","FPGA","ASIC"],"t":"インテリジェント信号処理を切り拓く協調最適化 動画像圧縮、生成AIモデルおよびそのハードウェア高速化に関する研究を行っています。アルゴリズム・アーキテクチャ協調最適化を通じて、精度と処理速度の高効率なトレードオフの実現を目指しています。","l":"https://hemingsun-lab.github.io/ja/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"中田研究室","p":"中田芳史(准教授)","k":["量子情報の基礎","量子誤り訂正","量子アルゴリズム","量子情報物理"],"t":"量子が拓く新たな情報科学 量子情報科学は、量子という物理理論と情報の考え方を融合し、情報処理の可能性と限界を根本から探る学問です。次世代を担う量子技術から理論物理の深淵まで、多様な観点から量子の最前線を切り拓いています。","l":"http://www.qinfo.comp.isct.ac.jp/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"柳澤研究室","p":"柳澤渓甫(准教授)","k":["構造バイオインフォマティクス","創薬インフォマティクス","量子アニーリング"],"t":"先端コンピューティング技術で生命・創薬の問題解決を目指す スーパーコンピュータや量子アニーラなど最先端の計算機システムを駆使し、シミュレーションからアルゴリズム設計まで幅広い方策を武器に、複雑な生命現象の解明や創薬分野への応用を目指した研究を行っています。","l":"https://www.bi.comp.isct.ac.jp/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"栗原研究室","p":"栗原淳(准教授)","k":["セキュリティ・プライバシ","ネットワークアーキテクチャ","ネットワークプロトコル","符号理論"],"t":"セキュリティとプライバシから創る将来ネットワーク 将来ネットワーク基盤に必須となるセキュリティ・プライバシの要素技術やプロトコルを、理論と実装の両面から研究しています。例えば、匿名化通信や情報秘匿手法について、理論設計から実装評価まで行っています。","l":"https://sec.comp.isct.ac.jp/index.html","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"伊藤研究室","p":"伊藤勇太(准教授)","k":["拡張現実感","ディスプレイ","人間拡張","バーチャルリアリティ"],"t":"現実を計算で賢く拡張する 将来、人と計算機の関係はどこまで強くなるのでしょうか？私たちは未来の計算機社会における人の在り方を拡張したいと思っています。そのために人と実世界の相互作用を計算し、干渉する技術を研究しています。","l":"https://augvislab.github.io/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"鄭研究室","p":"鄭顕志(准教授)","k":["自己適応システム","ソフトウェアアーキテクチャ","要求工学","モデル駆動工学"],"t":"環境変化に適応するしなやかなソフトウェアのつくりかた 環境変化に自動で適応する「しなやかなソフトウェア」はどのようにつくればよいのでしょうか？我々は実行時自動修正 (自己適応) 機能を組み込んだソフトウェアシステムのつくりかたについて研究しています。","l":"https://www.tei-lab.jp/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"曹研究室","p":"曹洋(准教授)","k":["信頼できる大規模モデル","データプライバシー","連合学習","データ市場"],"t":"AI社会を支える、信頼と自由のデータ基盤を創る AI社会の発展を支えるための「信頼と自由なデータ流通基盤の構築」を目指しています。信頼性のある大規模言語モデル、プライバシー保護、連合学習、データ市場などを中心に最先端の研究を行っています。","l":"https://cao-lab.org/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"荒瀬研究室","p":"荒瀬由紀(教授)","k":["自然言語処理","計算言語学","意味理解","表現学習"],"t":"人間のように言葉を理解し紡ぐ機械の実現 人間は言語により思考し、様々な事柄を効果的に表現できます。人間のように言語を理解し操る人工知能の実現を目指し、言い換え、意味理解、言語の表現学習を研究しています。","l":"https://arase-cl-lab.c.titech.ac.jp/ja/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"吉野研究室","p":"吉野幸一郎(特定教授)","k":["ロボット対話知能","自然言語処理","音声言語処理","マルチモーダル情報処理"],"t":"ロボットと対話の研究を通じて人の知能を明らかにする 実世界の情報を考慮した対話機能は人間が持つ知能の根幹です。こうした能力を持つ役立つロボットの研究開発をすると同時に、これらの研究により人間の知能とは何か明らかにしようとします。","l":"https://www.ird.c.titech.ac.jp/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"篠田研究室","p":"篠田浩一(教授)","k":["音声認識","映像情報検索","マルチメディア認証","マン・マシンインタラクション"],"t":"パターン認識手法とその実世界応用 音声や映像などのマルチメディアデータを対象として、 その認識・理解を行うアルゴリズムの研究やアプリケーションの開発に取組んでいます。","l":"https://sites.google.com/ks.c.titech.ac.jp/japanese/home","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"浜田研究室","p":"浜田省吾(助教)","k":["分子ロボティクス","ナノバイオシステム工学","DNAナノテクノロジー・DNAナノエンジニアリング","分子コンピューティング・分子プログラミング"],"t":"「生きた」分子ロボットをつくり、活かす 生体分子を駆使した人工システム構築に取り組んでいます。「生きた」分子ロボットの開発から、その特徴を活かした医療・材料分野などへの展開まで、分子を使った情報工学の応用とその社会実装を進めています。","l":"https://www.nanoeng.net","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"佐久間研究室","p":"佐久間淳(教授)","k":["機械学習","人工知能","セキュリティ","高信頼AI"],"t":"人間に信頼されるAIを実現する 最近のAIは急速に賢くなりましたが、AIに私たちの人生や命にかかわる判断を任せることができるでしょうか？人間に信頼されるAIを目指して、機械学習、統計学、セキュリティ、様々な観点から研究を進めています。","l":"https://sites.google.com/view/junsakuma/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"吉村研究室","p":"吉村奈津江(教授)","k":["脳波","核磁気共鳴画像（MRI）","AI","ブレインマシンインタフェース（BMI）"],"t":"脳機能の解読・可視化・維持向上に挑む 脳情報デコーディング技術による脳内情報の可視化やインタフェースの構築を通して、新たな科学的知見の発見や、あらゆる人々の心身の健康やQOLの向上に貢献できる情報やシステムの提供を目指しています。","l":"https://www.nicep.first.iir.titech.ac.jp/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"市瀬研究室","p":"市瀬龍太郎(教授)","k":["人工知能","機械学習","データマイニング","セマンティックWeb"],"t":"人工知能：知的機械を作る","l":"http://www.ai.iee.e.titech.ac.jp/index_j.html","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"齋藤研究室","p":"齋藤豪(准教授)","k":["コンピュータ・グラフィクス","画像処理","視覚","色科学"],"t":"人の見ること知覚すること表現することを研究します 描くこととは、見て、それを表現することです。その人の処理に関連する事柄を情報科学の手法で研究し、画像処理、コンピュータグラフィクスに応用することを目標にしています。","l":"https://www.img.cs.titech.ac.jp/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"大上研究室","p":"大上雅史(准教授)","k":["バイオインフォマティクス","AI・機械学習","計算創薬","高性能計算"],"t":"計算で生命を操る AI・機械学習、ビッグデータ解析、スーパーコンピューティング、大規模シミュレーション等を駆使して、生命科学・創薬・医療分野のイノベーション創出に挑戦しています。","l":"https://www.li.c.titech.ac.jp","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"佐藤研究室","p":"佐藤育郎(特任教授)","k":["コンピュータビジョン","機械学習","マルチメディア信号処理","自動運転"],"t":"コンピュータが目を持ったなら 機械学習に基づく視覚的な認識技術の確立を目的に、効率的に動作するアルゴリズムの開発や理論的な解析などを行っています。自動運転への応用など、安全かつ持続可能な社会への貢献を目指します。","l":"https://d-itlab.c.titech.ac.jp/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"金崎研究室","p":"金崎朝子(特定教授)","k":["コンピュータビジョン","ロボティクス","機械学習","3Dデータ認識"],"t":"データ駆動型知能ロボティクス 機械学習により実世界を認識し、行動を学習するロボットシステムの開発を進めています。","l":"https://kanezaki.github.io/index_jp.html","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"小野（峻）研究室","p":"小野峻佑(教授)","k":["画像処理","信号処理","数理最適化","データサイエンス・AI"],"t":"数理の⼒でセンシングデータから価値ある情報を抽出する 「数学なんて役に立つの？」一度は抱いたことのある疑問かもしれませんが、ノイズや欠損を伴うデータから価値ある情報を抽出し解析するためには数学の力が欠かせません。その面白さを私たちと一緒に探求しましょう。","l":"https://www.mdi.c.titech.ac.jp/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"林研究室","p":"林晋平(教授)","k":["ソフトウェア工学","ソフトウェア保守と進化","ソフトウェア開発環境","ソフトウェアリポジトリマイニング"],"t":"ソフトウェアの進化を促進させる賢いソフトウェア開発 ソフトウェアは様々な変更が積み重なってできています。変更の計画や実現、変更の分析、変更による品質改善の支援をはじめとして、ソフトウェア開発の課題に変更の側面から取り組んでいます。","l":"https://se.comp.isct.ac.jp/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"瀧ノ上正浩研究室","p":"瀧ノ上正浩(教授)","k":["情報生命物理学","分子コンピューティング・分子プログラミング","DNAナノテクノロジー・分子ロボティクス","生物物理学・非線形非平衡物理学"],"t":"分子コンピューティングによる人工生命システムの実現 生命は化学エネルギーを使ったある種の自律的な計算システムです。分子反応をプログラミングする新しい計算原理「分子コンピューティング」の情報科学と知的なソフトマターや人工細胞の生物物理学を開拓します。","l":"http://takinoue-lab.jp/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"一色研究室","p":"一色剛(教授)","k":["ハードウェア・プロセッサ自動設計","AIベース画像音声信号処理","生体認証","IoTセキュリティ・マルウェア検知"],"t":"あらゆるハードウェアシステムをSWプログラムで作り上げる これからの大規模AI・IoTシステム構築に不可欠なハードウェア・ソフトウェア設計自動化を統一的SW記述フレームワークで実現しています。","l":"http://www.vlsi.ict.e.titech.ac.jp/research/index-j.html","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"岡崎研究室","p":"岡崎直観(教授)","k":["自然言語処理","人工知能","機械学習","ウェブ"],"t":"ことばを分析・理解・生成できる賢いコンピュータとその応用 人間の情報伝達の主要な手段は言葉です。自然言語処理、すなわち言葉を操るコンピュータの研究を中心に、人工知能の実現を目指しています。さらに、ビッグデータ解析による社会観測などの応用を展開しています。","l":"http://www.nlp.c.titech.ac.jp/index.ja.html","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"デファゴ研究室","p":"デファゴクサビエ(教授)","k":["分散アルゴリズム","高信頼性","ミドルウェア","自律分散ロボット群"],"t":"分散システムは協調と一貫性？ 分散システム（Cloud、IoT、群ロボット等）の高信頼性における理論および実践を兼ね備えています。悪意のあるノードからの攻撃を防御する分散アルゴリズムの設計だけではなく、そのようなシステムを実現するミドルウェアの開発までも対象としています。","l":"http://www.coord.c.titech.ac.jp/jp/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"村田研究室","p":"村田剛志(教授)","k":["人工知能","Webマイニング","社会ネットワーク分析"],"t":"ネットワークから知識を見出す 村田研究室では、人工知能やWebマイニングの研究を行っています。特にネットワーク構造からの知識発見を行っています。","l":"http://www.net.c.titech.ac.jp/index-j.html","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"石田研究室","p":"石田貴士(教授)","k":["データマイニング","バイオインフォマティクス","機械学習","分子シミュレーション"],"t":"機械学習などの大規模データ解析技術で生命科学研究を促進 分子生物学、医学、薬学などの生命科学の大規模なデータを対象にして、機械学習などのデータマイニング技術を使って有用な知識の獲得や予測モデルを構築するための技術を開発しています","l":"http://www.cb.cs.titech.ac.jp","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"西崎研究室","p":"西崎真也(教授)","k":["プログラミング言語理論","ソフトウェア検証論"],"t":"理論を応用へ プログラミング言語の理論的研究や、ソフトウェアに関連する数理論理学をどのように応用していくかということについて研究しています。","l":"http://www.lambda.cs.titech.ac.jp/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"小林研究室","p":"小林隆志(教授)","k":["ソフトウェア工学","ソフトウェア開発支援","ソフトウェア保守・デバッグ","ソフトウェア設計"],"t":"ソフトウェア開発における再利用可能な経験を活用する ソフトウェアそのものや、その実行時のログ、開発者の行動などを解析しソフトウェア開発に役立つ情報を抽出・活用するための研究を行っています。","l":"http://www.sa.cs.titech.ac.jp/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"小野研究室","p":"小野功(教授)","k":["進化計算","最適化","人工知能"],"t":"進化原理に基づく新たな人工知能 人間のように発明や発見ができるコンピュータを作りたい！－これが研究室の大目標です。そのため、人工知能の一つである進化計算の研究を行なっています。進化計算は新幹線やジェット機の設計にも利用されています。","l":"http://www.ic.dis.titech.ac.jp/main/doku.php","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"秋山研究室","p":"秋山泰(教授)","k":["バイオインフォマティクス","創薬支援計算","高性能計算","機械学習応用"],"t":"最先端計算技術で、生物のゲノム配列解析や創薬産業を加速 ヒトの病因解明、創薬支援、環境中の微生物解析等への応用を目指して、医学・薬学・生物学の大量データの解析と大規模シミュレーション技術の研究を、スーパーコンピュータやクラウドをフルに活用して行っています。","l":"http://www.bi.cs.titech.ac.jp/web/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"山田誠二研究室","p":"山田誠二","k":["ヒューマンエージェントインタラクション","知的インタラクティブシステム","人工知能","ユーザインタフェース"],"t":"人とコンピュータが協調した問題解決を実現する ユーザとながく付き合っていけるパートナーとしてのエージェント、ロボット、そして人間の能力を活かすインタラクティブシステムの実現を目指し、人工知能、インタラクションデザインの研究をしています。","l":"http://www.ymd.nii.ac.jp/lab/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"高安美佐子研究室","p":"高安美佐子(教授)","k":["ビッグデータ解析","統計物理学","現象モデリング・シミュレーション","経済社会物理学・生物物理学"],"t":"ビッグデータが複雑な現象を切り開く! 人間の活動・経済・生体情報などのビッグデータを用いて現象を観測し、現象を再現するミニマルな数理モデルを構築します。構築したモデルを用いて、理論解析やシミュレーションにより、複雑なシステムを理解します。","l":"http://www.smp.c.titech.ac.jp/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"権藤研究室","p":"権藤克彦(教授)","k":["ソフトウェア工学","ソフトウェア開発ツール","プログラミング教育","ソフトウェア開発における人的要素"],"t":"ソフトウェア作りを助けるソフトウェアを作ろう 私達の研究室ではプログラム開発者を支援するツールを研究しています。プログラミングという高度な知的作業を楽しみながら、現実のソフトウェアに適用可能なツールをプログラムとして実装しています。","l":"http://www.sde.cs.titech.ac.jp/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"金子研究室","p":"金子晴彦(准教授)","k":["高信頼コンピューティング","誤り制御符号","データ圧縮"],"t":"高信頼・高効率コンピュータシステムのための符号化技術 コンピュータシステムの高信頼化と高効率化に有効な、誤り制御符号やデータ圧縮技術の研究を行っています。","l":"https://hk.mokuren.ne.jp/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"宮崎研究室","p":"宮崎純(教授)","k":["情報検索","情報推薦","大規模・高性能計算","ユーザインタフェース"],"t":"ユーザに優しい賢い情報検索・情報推薦システムを目指して 次世代の高精度な情報検索や情報推薦システムの研究をメインに、そのための膨大な情報を処理する大規模情報管理技術や高性能計算モデルについても探求しています。","l":"https://www.lsc.comp.isct.ac.jp/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"吉瀬研究室","p":"吉瀬謙二(教授)","k":["計算機システム","プロセッサ","並列処理","FPGA"],"t":"高性能コンピューティングシステムのためのアーキテクチャを探求 ソフトウェアシミュレータやFPGAを駆使して、メニーコアプロセッサやアクセラレータ等の高性能コンピューティングシステムを実現するアーキテクチャに関する研究・開発をおこなっています。","l":"http://www.arch.cs.titech.ac.jp/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"下坂研究室","p":"下坂正倫(准教授)","k":["情報処理","ビッグデータ","データ解析"],"t":"ユビキタスコンピューティングとデータ解析で切り開く豊かな社会 パーソナルデータ、ライフログ、ビッグデータ、IOT、ユビキタスコンピューティングとその領域における統計的データ解析に注目して研究を進めています。","l":"http://www.miubiq.cs.titech.ac.jp/ja/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"横田理央研究室","p":"横田理央(教授)","k":["高性能計算","大規模並列計算","流体シミュレーション","分子シミュレーション"],"t":"次世代計算機のための高速化アルゴリズムによる科学技術計算","l":"http://www.rio.gsic.titech.ac.jp","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"関嶋研究室","p":"関嶋政和(准教授)","k":["創薬インフォマティクス","バイオインフォマティクス","分子シミュレーション","高性能計算"],"t":"スーパーコンピュータによる創薬支援技術の開発とその応用 分子シミュレーション、バイオインフォマティクス、大規模GPU計算といった東工大の強みを結集し、生化学実験とIT支援技術を融合したスマート創薬を通じて、オープンなアカデミア創薬の実現を目指します。","l":"http://www.cbi.c.titech.ac.jp","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"渡部研究室","p":"渡部卓雄(教授)","k":["プログラミング言語","サイバーフィジカルシステム","自己反映計算とメタプログラミング","形式手法"],"t":"高度に複雑でセキュアなシステムを表現するプログラミング言語 実世界に組込まれた計算機システムのためのプログラミング言語の理論・設計・実装技術およびプログラミング方法論、形式手法にもとづくセキュアなソフトウェアの構築手法などについて研究を行なっています。","l":"https://www.psg.c.titech.ac.jp","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"小池英樹研究室","p":"小池英樹(教授)","k":["ヒューマン・コンピュータインタラクション","コンピュータビジョン","コンピュータグラフィックス","情報セキュリティ"],"t":"画像処理とグラフィックスで次世代HCIを作る コンピュータビジョンによる視線・ジェスチャ認識の応用、グラフィックスを用いた大規模情報の視覚化、デジタル・スポーツ、視覚化の情報セキュリティへの応用などを研究しています。","l":"https://www.vogue.cs.titech.ac.jp/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"吉川研究室","p":"吉川","k":["自然に学んでしまう仕組みづくり","思い込み解消","ゲームなどをすることで学ぶ","経営にも使える情報の活用の仕方"],"t":"日常に関心を 人がどうして学べるのか、単純なこの疑問を解決することを行っています。そのために、テストを作ったり、教材をつくったり、評価の仕方も考えます。大人はそう簡単に学ばないのでやりがいがあります","l":"http://www.trn.dis.titech.ac.jp/yoshi_lab/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 情報工学系","n":"藤井研究室","p":"藤井","k":["自然言語処理","情報検索","ウェブマイニング"],"t":"言葉で操り言葉で魅せるコンピュータの実現を目指して 言葉とは情報であり通信であり作品です。言葉を理解し、言葉で感動を与える、そんなコンピュータの実現に向けた研究課題に取り組んでいます。","l":"https://www.cl.c.titech.ac.jp/~fujii/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 数理・計算科学系","n":"七島幹人研究室","p":"七島幹人(准教授)","k":["計算複雑さ理論","計算論的学習","メタ計算量","暗号理論"],"t":"計算の限界と可能性 計算資源と能力の関係を扱う計算複雑さ理論を主軸として、学習や暗号などを含む情報科学の主要概念についての理論的限界や可能性を探究しています。","l":"https://nanashima.github.io/lab/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 数理・計算科学系","n":"坂本龍一研究室","p":"坂本龍一(准教授)","k":["マイクロサービス","ハイパフォーマンスコンピューター","計算機アーキテクチャ","システムソフトウェア"],"t":"省電力・高性能なコンピューターの実現を目指して 高性能かつ省電力なコンピューターの実現を目指した研究を行っています。回路からアルゴリズムまで複数のシステム階層が連携・協調することで、これまでにないスマートなシステムの構築を目指しています。","l":"https://www.sakamotolab.net/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 数理・計算科学系","n":"高橋仁研究室","p":"高橋仁(准教授)","k":["偏微分方程式","非線形放物型方程式","拡散方程式","サイバーセキュリティ","サイバーレジリエンス","インシデント対応技術"],"t":"非線形偏微分方程式における解の特異性 拡散に関わる偏微分方程式の解の特異性を中心に，数学的手法を用いて研究しています．中でも，非線形放物型と呼ばれるクラスに属す，時間発展をともなう方程式に興味を持っています。","l":"https://researchmap.jp/j_takahashi","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 数理・計算科学系","n":"小林諒平研究室","p":"小林諒平(准教授)","k":["計算機システム","高性能計算","演算加速器","リコンフィギャラブルコンピューティングシステム"],"t":"コンピュータサイエンスにおいて，速いことは正義である。 当研究室では，超並列計算機システムの研究開発およびそのシステムを⽤いた実問題への応⽤，特にGPUをはじめとした演算加速装置 (アクセラレータ) に基づく高性能計算に関する研究を実施しています。","l":"https://www.ac2.scrc.iir.isct.ac.jp/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 数理・計算科学系","n":"田中健一郎研究室","p":"田中健一郎(教授)","k":["数値解析","数値計算アルゴリズム"],"t":"数値計算法とその数理を探求する","l":"https://kentanakadpp.github.io/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 数理・計算科学系","n":"三好直人研究室","p":"三好直人(教授)","k":["応用確率論","情報通信システムの確率モデル","待ち行列理論","無線通信ネットワーク"],"t":"確率を用いて不規則・不確実性を解析する 不規則・不確実性を含む問題を確率を用いてモデル化し、解析しています。特に、情報通信や計算機科学の分野に現れる確率的な現象に興味を持っています。","l":"https://www.is.c.titech.ac.jp/~miyoshi/lab/index-j.html","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 数理・計算科学系","n":"叢悠悠研究室","p":"叢悠悠(助教)","k":["プログラミング言語","プログラミング教育"],"t":"プログラムを正しく、書きやすく プログラミング言語を理論的・教育的側面から研究しています。具体的には、プログラムの正しさを保証するための技術や、プログラミング初学者を支援する環境を開発しています。","l":"https://prg.is.titech.ac.jp/ja/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 数理・計算科学系","n":"藤澤克樹研究室","p":"藤澤克樹(教授)","k":["数理最適化","深層学習","グラフ解析","高性能計算"],"t":"数理・計算科学の最新技術による超スマート社会の実現 超スマート社会の実現に向けて現実と仮想空間を一体化させて、社会問題の解決を目指します。AI、数理最適化、グラフ解析、高性能計算の活用によって、産学連携による実社会アプリケーションを実現します。","l":"https://sites.google.com/view/fujisawa-lab/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 数理・計算科学系","n":"横井優研究室","p":"横井優(准教授)","k":["組合せ最適化","離散数学","アルゴリズム的ゲーム理論"],"t":"最適性や公平性のための離散アルゴリズム 離散数学やアルゴリズムを研究しています。 グラフや集合に関する問題や、選好を伴うマッチング問題などに対し、最適性や公平性を達成するアルゴリズムの設計を目指しています。","l":"https://yu-yokoi-1.github.io/lab/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 数理・計算科学系","n":"荒井迅研究室","p":"荒井迅(教授)","k":["力学系","計算トポロジー"],"t":"力学系と計算トポロジー 力学系と計算トポロジーの数学を研究しています。計算機科学を用いて、純粋数学と具体的な問題を繋ぐ架け橋を築くことを目指しています。","l":"https://www.zinarai.org/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 数理・計算科学系","n":"安永憲司研究室","p":"安永憲司(准教授)","k":["暗号理論","計算理論","符号理論","理論計算機科学"],"t":"暗号や計算を数学的に見てみよう 理論計算機科学で登場する様々な技術（暗号技術や誤り訂正符号など）を題材に、理論的にできることとできないことの境界を探ります。","l":"https://tcc.c.titech.ac.jp/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 数理・計算科学系","n":"高邉賢史研究室","p":"高邉賢史(准教授)","k":["統計物理学","信号処理","機械学習","最適化"],"t":"「たくさん」から始める情報処理 たくさんのモノを扱う統計物理学や機械学習を用いて各種情報処理、信号処理の理論研究と応用に取り組んでいます。","l":"https://isp.c.titech.ac.jp/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 数理・計算科学系","n":"澄田範奈研究室","p":"澄田範奈(准教授)","k":["組合せ最適化","アルゴリズム","数学","解析学","微分方程式論","数理物理"],"t":"理論的に良い最適化アルゴリズムを設計する","l":"https://alg.c.titech.ac.jp/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 数理・計算科学系","n":"土岡俊介研究室","p":"土岡俊介(准教授)","k":["表現論","量子代数","圏論化","リー理論"],"t":"対称性 数論が数の研究なのだとしたら、表現論は対称性の研究となります。リー理論や量子代数、圏論化を用いてラマヌジャンのような公式を見つけるのが目標の1つです。","l":"https://www.kurims.kyoto-u.ac.jp/~tshun/index.html","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 数理・計算科学系","n":"鈴木咲衣研究室","p":"鈴木咲衣(准教授)","k":["結び目理論","量子トポロジー","四色問題","パーシステントホモロジー"],"t":"結び目理論と量子トポロジー 結び目や3次元多様体の量子不変量を研究しています。四色問題やパーシステントホモロジーを使った応用数学にも興味があります。","l":"https://sakietotera-lab.com","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 数理・計算科学系","n":"金森敬文研究室","p":"金森敬文(教授)","k":["機械学習","数理統計学","情報幾何学"],"t":"機械学習・統計学から「情報」の本質を探る データに含まれるお宝を発掘し利用する機械学習や統計学の技術は、社会に大きなインパクトを与えています。我々は数理の立場から情報を定量的に理解し、その成果をデータ科学全般に応用することを目指しています。","l":"https://sites.google.com/site/tokyotechkanamoritakafumilab/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 数理・計算科学系","n":"脇田建研究室","p":"脇田建(准教授)","k":["社会ネットワーク解析","情報可視化","プログラミング言語"],"t":"超高次元の世界を自在に旅する 対話的超高次元可視化技術の研究では複雑に絡まった社会ネットワークやビッグデータを優しく紐解きます。高次元世界で迷子にならずに、目当ての構造をすばやく把握できることを目指しています。","l":"https://wakita.github.io/smartnova/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 数理・計算科学系","n":"梅原雅顕研究室","p":"梅原雅顕(教授)","k":["微分幾何学","多様体","曲線・曲面"],"t":"曲線・曲面などビジュアルなものを研究対象としております。 現在おもに時空の極大曲面、3次元ド・ジター時空の平均曲率1の曲面、および特異点の等長変形などについて研究中です。","l":"http://m-umehara.g.dgdg.jp/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 数理・計算科学系","n":"南出靖彦研究室","p":"南出靖彦(教授)","k":["ソフトウェア検証","プログラミング言語","計算モデル"],"t":"未来のソフトウェアのための科学的基盤を開拓しよう プログラミング言語や計算モデルなどのソフトウェアの基礎となる理論を研究し、ソフトウェアの安全性や正しさを検証する理論・技術の確立を目指しています。","l":"http://sv.c.titech.ac.jp/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 数理・計算科学系","n":"田中圭介研究室","p":"田中圭介(教授)","k":["暗号理論","暗号通貨・ブロックチェーン技術","サイバーセキュリティ"],"t":"情報セキュリティに数学的視点からアプローチする 我々の研究室では情報セキュリティに数学的視点からアプローチしています。具体的には暗号理論、暗号通貨・ブロックチェーン技術、サイバーセキュリティを研究しています。","l":"https://cybersecurity.c.titech.ac.jp/profs/tanaka.html","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 数理・計算科学系","n":"増原英彦研究室","p":"増原英彦(教授)","k":["プログラミング言語","ソフトウェア開発環境","ソフトウェア科学"],"t":"プログラミングをもっと楽しく! プログラミング言語・環境の理論・設計・実現方式が主なテーマです。特に先進的なモジュール化技術、高性能化、ソフトウェア開発環境の改善などプログラミング言語に関する様々な側面を追求しています。","l":"https://prg.is.titech.ac.jp/ja/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 数理・計算科学系","n":"鹿島亮研究室","p":"鹿島亮(准教授)","k":["非古典論理","数理論理学"],"t":"非古典論理の数学的研究","l":"https://www.is.c.titech.ac.jp/~kashima/index-j.html","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 数理・計算科学系","n":"山下真研究室","p":"山下真(教授)","k":["数理最適化","応用数学","最適化","オペレショーンズ・リサーチ"],"t":"最適解を数学とコンピュータの力で導き出す 実社会における効率向上には、様々な条件を満たす中から最適な対象を求解することが重要です。山下研究室では、数学とコンピュータによる理論的なアプローチで最適解を追究します。","l":"http://www.opt.comp.isct.ac.jp/lab/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 数理・計算科学系","n":"遠藤敏夫研究室","p":"遠藤敏夫(教授)","k":["高性能計算","ソフトウェア","アクセラレータ","メモリ階層"],"t":"スパコンによる世界一精細・高速なシミュレーションの実現","l":"http://www.el.gsic.titech.ac.jp/endolab/","a":1,"w":"","c":"2026-10-06"},{"u":"東京科学大学","d":"情報理工学院 数理・計算科学系","n":"中野張研究室","p":"中野張(准教授)","k":["制御理論","確率過程","ファイナンス"],"t":"不確実性をコントロールする 確率制御問題の理論や数値解析法、およびそのファイナンスへの応用について研究しています。","l":"https://yumiharu-nakano.github.io/nakano-lab/","a":1,"w":"","c":"2026-10-06"},{"u":"東京大学","d":"情報理工学系研究科 コンピュータ科学専攻","n":"小林研究室","p":"小林直樹(教授)","k":["ソフトウェア基礎理論","プログラミング言語","プログラム検証","高階モデル検査"],"t":"ソフトウェアの信頼性・性能向上のため，型理論・形式言語とオートマトン・定理証明など理論計算機科学に基づく研究を行う．高階モデル検査，プログラムの自動検証，データ圧縮，セキュリティプロトコルの自動検証などがテーマ．","l":"https://www.kb.is.s.u-tokyo.ac.jp/","a":2,"w":"","c":"2026-10-06"},{"u":"東京大学","d":"情報理工 床データを活用した疫学研究，レセプトデータを活用した疫学などが挙がっている．","l":"https://ds.k.kyoto-u.ac.jp/introduction/member/tamura/","a":14,"w":"","c":"2026-10-06"},{"u":"京都大学","d":"京都大学大学院情報学研究科 データ科学コース","n":"物理知能","p":"森本 淳(教授)、山森 聡(特定助教)","k":["物理知能","強化学習","ロボティクス","ヒューマノイド運動学習"],"t":"身体を持つ機械が経験を通じて学習し，より良く行動するための方法論の導出に向けた研究を進める(学習機械分野と同一サイト)．","l":"https://lm.sys.i.kyoto-u.ac.jp/","a":14,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報基礎数学専攻","n":"幾何解析学講座","p":"中村誠(教授)","k":["非線形偏微分方程式"],"t":"主な研究対象は非線形の偏微分方程式です。ニュートンの運動方程式は、時間変数という一つの独立変数を持つ微分方程式ですが、時間変数と空間変数という多変数の独立変数を持つ微分方程式が偏微分方程式です。自然現象に現れる様々な相互作用を表す非線形項を追加して偏微分方程式を考察しています。","l":"http://math.ist.osaka-u.ac.jp/course/course_nakamuramakoto/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報基礎数学専攻","n":"幾何解析学講座","p":"安井弘一(准教授)","k":["低次元トポロジー"],"t":"私は４次元トポロジーを中心に低次元トポロジーの研究をしています。多様体の微分構造に関して４次元は最も謎に満ちた次元で、他のどの次元にも見られない興味深い現象が多数存在します。例えば、ユークリッド空間がエキゾチック（すなわち同相だが微分同相でない）微分構造を許容する唯一の次元です。","l":"http://math.ist.osaka-u.ac.jp/course/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報基礎数学専攻","n":"離散幾何学講座","p":"東谷章弘(准教授)","k":["組合せ論と可換代数"],"t":"私は主に格子多面体について研究しています。特に、格子多面体のEhrhart多項式、つまり、格子多面体を膨らませたものに含まれる格子点の数え上げ函数に興味を持っています。格子多角形Pに対し、Pの面積がPの格子点数によって計算できるという、いわゆるピックの公式があります。","l":"https://www.ist.osaka-u.ac.jp/japanese/researcher/detail.php?id=3","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報基礎数学専攻","n":"離散構造学講座","p":"若林泰央(准教授)","k":["代数幾何学と数論幾何学"],"t":"代数多様体上の微分方程式や接続を分類するモジュライ空間を数論的観点から調べることがおもな研究テーマです。たとえば、正標数における微分方程式およびその解は複素領域などの場合と異なり特殊な振る舞いをするため、（p進的な手法を含む）正標数特有の理論を発展させることによって理解する必要があります。","l":"https://www.ist.osaka-u.ac.jp/japanese/researcher/detail.php?id=4","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報基礎数学専攻","n":"応用解析学講座","p":"杉山由恵(教授)","k":["偏微分方程式"],"t":"非線形偏微分方程式論を専門としています。特に、生命現象を背景とした移流拡散方程式系を研究対象とし、関数解析的手法による数学解析に取り組んでいます。平成27年度にJST戦略的創造研究推進事業さきがけ「社会的課題の解決に向けた数学と諸分野の協働」に採択されています。","l":"http://math.ist.osaka-u.ac.jp/course/course_sugiyamayoshie/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報基礎数学専攻","n":"応用解析学講座","p":"茶碗谷毅(准教授)","k":["大自由度力学系"],"t":"多数の要素の集団からなるような系では、個々の要素の時間変化は一見バラバラであるにもかかわらず集団として非自明な動的構造が現れることがしばしばみられます。 このような微視的な乱れと巨視的な構造の共存する系において、巨視的・統計的なレベルでみられる何らかの規則性をもった構造が微視的な運動を支配する力学の中から生まれてくる機構については、まだよくわかっていないことがいっぱいあります。","l":"https://www.ist.osaka-u.ac.jp/japanese/researcher/detail.php?id=7","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報基礎数学専攻","n":"大規模数理学講座","p":"三町勝久(教授)","k":["複素積分と表現論","数理物理"],"t":"理工学諸分野で現れる幾つかの素性の良い函数は、他の凡庸な函数と比較して特殊な地位を占めるという意味で、特殊函数といわれます。基本的な例はガウスの超幾何函数です。特殊函数を調べるという研究の歴史は古いですが、私が行っているのは、特殊函数の現代的な視点からの研究、特に複素積分の理論と表現論からのアプローチです。","l":"https://www.ist.osaka-u.ac.jp/japanese/researcher/detail.php?id=8","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報基礎数学専攻","n":"大規模数理学講座","p":"縄田紀夫(准教授)","k":["作用素環論"],"t":"作用素環とは、Hilbert空間上の有界線形作用素全体のなす環の部分環 で随伴作用素をとる演算と適切な位相で閉じたものです。 作用素論、表現論、量子力学の数学的定式化、抽象代数学への応用等を念頭に生まれた 数学的対象ですが、現在では様々な数学の分野や物理学と関連して研究されています。","l":"https://www.ist.osaka-u.ac.jp/japanese/researcher/detail.php?id=9","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報基礎数学専攻","n":"【協力講座】コンピュータ実験数学講座［D3センター］","p":"降籏大介(教授)","k":["偏微分方程式の構造保存数値解法"],"t":"微分方程式の数学的構造を離散的に保存・再現するような数値解法を一般に構造保存数値解法とよび、これについて研究を行っています。 常微分方程式保存系について、こうした研究は広く行われ、Symplectic解法などが有名ですが、偏微分方程式についてはフレームワークとしてのこうした研究はほとんどありませんでした。","l":"http://www.cas.cmc.osaka-u.ac.jp/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報基礎数学専攻","n":"【協力講座】コンピュータ実験数学講座［D3センター］","p":"宮武勇登(准教授)","k":["数値解析"],"t":"応用数学や数理工学全般に興味を持っていますが、特に微分方程式の数値解析の研究を行っています。 応用上重要な微分方程式には、例えばHamilton系のように豊富な数理構造を持つものが少なくなく、そのような数理構造を壊さない離散化手法の開発や、 開発した手法を用いた解析などを行っています。","l":"http://www.cas.cmc.osaka-u.ac.jp/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報数理学専攻","n":"計画数理学講座","p":"藤崎泰正(教授)","k":["システム制御理論"],"t":"ハイブリッド自動車、巨大航空機など、現代のシステムは高度な制御技術に支えられています。システム制御理論はその数理的基盤の一つであり、動き（ダイナミクス）をデザインするための方法論を与えるものです。実際、携帯電話、電気自動車の普及を見据えた電力網、国境を越えた生産・物流・情報システムなど、高度にネットワーク化された大規模なシステムを安定に運用しつつ高機能化するためにも、システム制御理論のさらなる充実が求められています。","l":"http://www-door.ist.osaka-u.ac.jp/index.htm","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報数理学専攻","n":"非線形数理講座","p":"鈴木秀幸(教授)","k":["非線形ダイナミクスとその応用"],"t":"非線形なルールに従って時間発展するシステムの挙動（非線形ダイナミクス）を研究しています。単純な写像や微分方程式で記述されたシステムから、想像もつかないほど豊かな振る舞いが現れてくることが、非線形ダイナミクスの大きな魅力です。","l":"https://www.ist.osaka-u.ac.jp/japanese/researcher/detail.php?id=15","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報数理学専攻","n":"非線形数理講座","p":"白坂将(准教授)","k":["非線形力学系の次元縮約とその応用"],"t":"自然界にみられる動的なふるまいの多くは大自由度かつ非線形性を伴い、その解析は容易ではありません。しかしながら、ニューロンやタンパク質といった機能的な素子、さらにはその集団のふるまいの背後に、低次元の骨組みが潜んでいることもよく観察されます。","l":"https://www.ist.osaka-u.ac.jp/japanese/researcher/detail.php?id=17","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報数理学専攻","n":"情報フォトニクス講座","p":"小倉裕介(教授)","k":[],"t":"著しく進展した情報社会の中で、多様な情報を効率的、高速に扱うことが求められています。光が中心的役割を果たす技術の一つとして光通信がありますが、情報科学・技術における光の潜在能力はより大きく幅広いものです。","l":"http://www-lip.ist.osaka-u.ac.jp/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報数理学専攻","n":"情報フォトニクス講座","p":"西村隆宏(准教授)","k":[],"t":"","l":"https://www.ist.osaka-u.ac.jp/japanese/researcher/detail.php?id=205","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報数理学専攻","n":"システム数理学講座","p":"山口勇太郎(准教授)","k":["組合せ最適化","アルゴリズム","オペレーションズ・リサーチ"],"t":"「 A 地点から B 地点までなるべく速く移動したい」と思ったとき、Google Map などのナビゲーションシステムを使えば、どんな経路を選べば良いかが瞬時に分かります。この背後には、地図データの正確さやコンピュータの計算能力の高さに加え、「具体的な計算の手順を定める」アルゴリズムの力が潜んでいます。","l":"http://www-sys.ist.osaka-u.ac.jp/lab/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"コンピュータサイエンス専攻","n":"アルゴリズム設計論講座","p":"泉泰介(教授)","k":["理論計算機科学"],"t":"分散システムを中心とした、様々な計算モデルの上でのアルゴリズム設計手法並びに計算限界解明の研究を行っています。","l":"https://algodesign.ist.osaka-u.ac.jp/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"コンピュータサイエンス専攻","n":"ソフトウェア設計学講座","p":"楠本真二(教授)","k":["ソフトウェア見積り","IT技術者の業務遂行力","技術スキル","行動特性の評価"],"t":"ソフトウェア開発計画の作成では、開発に要する時間やコストを算出するために見積りという行為が行われる。一般的には、最初に開発対象ソフトウェアの規模が見積もられ、引き続き、開発工数、開発期間、コストが見積もられる。","l":"https://sdl.ist.osaka-u.ac.jp/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"コンピュータサイエンス専攻","n":"ソフトウェア設計学講座","p":"柗本真佑(准教授)","k":["自動プログラム生成"],"t":"プログラミングは高度な知識とスキルを要する極めて知的な生産活動であると同時に、一種のゲームのような面白さを内包しています。対象とする問題を一般化し、データと処理の境界を見極め、ソースコードという曖昧性を一切許さない表現に落とし込む、この作業の楽しさは他に類するものを見ません。","l":"https://sdl.ist.osaka-u.ac.jp/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"コンピュータサイエンス専攻","n":"ソフトウェア工学講座","p":"肥後芳樹(教授)","k":["コードクローン検出","自動プログラム修正"],"t":"コードクローンとはソースコード中に存在する類似したコードを表します。コードクローンの存在はソフトウェアの開発や保守において悪影響を与えることがあります。例えば、コードクローンの存在を把握せずにバグ修正のためにソースコードに変更を加えた場合、変更箇所のコードクローンにも同様のバグが存在している可能性がありますが、開発者がその存在を把握しているとは限りません。","l":"https://sel.ist.osaka-u.ac.jp/ja/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"コンピュータサイエンス専攻","n":"ソフトウェア工学講座","p":"KULA RAULA GAIKOVINA(教授)","k":["ソフトウェアエコシステム","コードとしての開発者の熟練度"],"t":"ソフトウェアはもはや単独で開発されるものではなく、私たちは多くのサードパーティライブラリやフレームワークに依存して機能を提供しています。開発者がこれらの依存関係を管理する際、依存性管理やバージョン互換性の問題が発生することがあります。","l":"https://sel.ist.osaka-u.ac.jp/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"コンピュータサイエンス専攻","n":"並列処理工学講座","p":"伊野文彦(教授)","k":["高性能計算"],"t":"人間と比べて計算機は短い時間で計算結果を示してくれます。しかし、どのような複雑な計算であれ、計算機は一瞬で計算を完了できる万能品でしょうか？違います。世界最速のスーパーコンピュータをもってしても、意味のある時間内に解けない問題は多々あります。","l":"https://www.ist.osaka-u.ac.jp/japanese/researcher/detail.php?id=51","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"コンピュータサイエンス専攻","n":"並列処理工学講座","p":"置田真生(准教授)","k":["大規模並列計算"],"t":"近年、単一プロセッサの性能向上は限界が近づいており、スパコン「京」に代表されるような数万台のプロセッサからなるコンピュータを駆使する並列計算に期待が寄せられています。しかし、並列計算のプログラムでは複数のプロセッサをうまく協調させる必要があり、プロセッサの台数が増えれば増えるほど、台数に見合った効果を得ることが難しくなります。","l":"http://www-ppl.ist.osaka-u.ac.jp/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"コンピュータサイエンス専攻","n":"【協力講座】知能メディアシステム講座［産業科学研究所］","p":"中島悠太(教授)","k":["ビジョンと言語","深層学習とバイアス"],"t":"人は多くの情報を視覚から獲得していると言われており、さらにその情報を日本語や英語などの言語に対応させて、自分が見たものを記録したり、伝えたりすることができます。ビジョンと言語は、コンピュータを使って人がもつこの機能を実現しようとする研究領域で、コンピュータビジョン・パターン認識、自然言語処理、機械学習の共通部分に位置します。","l":"https://www.is.ids.osaka-u.ac.jp/ja/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"コンピュータサイエンス専攻","n":"【協力講座】知能メディアシステム講座［産業科学研究所］","p":"大倉史生(准教授)","k":[],"t":"コンピュータビジョンは、カメラで撮影した情報を処理して有用な情報を獲得する、すなわちコンピュータが「見る」研究分野です。一方、コンピュータグラフィックスは、コンピュータが人に視覚的な情報を提示する、すなわちコンピュータが「見せる」研究分野です。","l":"http://cvl.ist.osaka-u.ac.jp/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"コンピュータサイエンス専攻","n":"【協力講座】知能センシング講座［D3センター］","p":"長原一(教授)","k":["コンピュテーショナルフォトグラフィ","ディープセンシング"],"t":"一般的に画像処理やコンピュータビジョンの研究分野では、通常のカメラが画像の入力装置として疑問もなく用いられている。市販のカメラの光学系は、受光センサ上に人が見てきれいだと感じる画像を撮影されるように最適設計されているが、画像処理や画像認識の応用にとってこの光学系が最適であるとは限らない。","l":"https://www.is.ids.osaka-u.ac.jp/ja/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"コンピュータサイエンス専攻","n":"【協力講座】知能センシング講座［D3センター］","p":"早志英朗(准教授)","k":["機械学習と実データ解析応用"],"t":"私たちの身の回りはデータで溢れています。あなたが今読んでいるこの文章もデータです。そして、データと人の知識とちょっとした工夫をうまく組み合わせると、実世界の問題解決や新たな知識発見に繋がる可能性があります。","l":"https://www.is.ids.osaka-u.ac.jp/ja/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"コンピュータサイエンス専攻","n":"【協力講座】知能センシング講座［D3センター］","p":"山藤浩明(准教授)","k":["コンピュータビジョン"],"t":"コンピュータビジョンは、カメラから得られる視覚情報を解析し、実世界を理解することを目指す分野です。私はその中でも、シーンを立体的に理解する3Dビジョンに関心があり、2次元画像から3次元情報を再構成する3次元形状復元などの研究に取り組んでいます。","l":"https://www.is.ids.osaka-u.ac.jp/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"コンピュータサイエンス専攻","n":"【協力講座】ビジネスプラットフォーム講座［D3センター］","p":"鎗水徹(教授)","k":[],"t":"企業・組織の発展において今やIT技術の活用は不可欠であり、その巧拙により国際競争力が左右される状況です。そこで、経営戦略・IT戦略を融合した形で競争優位を実現するにはどのようにしたらよいか、デジタル技術を活用した「デジタル・トランスフォーメーション」の実現に向けた理論と実践について研究を行っています。","l":"https://www.d3c.osaka-u.ac.jp/research/dx-research-division/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"コンピュータサイエンス専攻","n":"【協力講座】ビジネスプラットフォーム講座［D3センター］","p":"春本要(教授)","k":[],"t":"IoT技術やAI技術をはじめとする情報分析技術の進展により、現実空間の情報をサイバー空間で高度に分析し、その結果を現実空間にフィードバックすることによって人間社会の様々な社会課題を解決しようというSociety5.0の実現が求められています。","l":"https://www.ist.osaka-u.ac.jp/japanese/researcher/detail.php?id=193","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"コンピュータサイエンス専攻","n":"【協力講座】ビジネスプラットフォーム講座［D3センター］","p":"甲斐尚人(准教授)","k":[],"t":"オープンサイエンスの世界的な潮流によって、オープンデータとオープンアクセスによる研究データの利活用を促進する動きが高まっており、適切なデータ利活用を実現するための研究データ管理の重要性が増している。特に、オープンサイエンス、研究公正の観点から体系的、組織的に研究データを管理していくことが求められています。","l":"https://sites.google.com/ids.osaka-u.ac.jp/datability-platform-research/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"コンピュータサイエンス専攻","n":"【協力講座】ビジネスプラットフォーム講座［D3センター］","p":"釜池聡太(准教授)","k":["プラットフォーム戦略"],"t":"企業・組織の競争力を左右する要因として、IT技術の戦略的活用がますます重要になっています。経営戦略とIT戦略を掛け合わせることで初めてDXは実現できるという考えのもと、その理論的枠組みの構築と実践的な施策立案・実行を研究の両輪としています。","l":"https://bpf.d3c.osaka-u.ac.jp/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報システム工学専攻","n":"機械学習システム論講座","p":"河原吉伸(教授)","k":["機械学習の原理探究と方法論構築","及び科学・工学的応用"],"t":"社会インフラのDX化やSDGsへの強い関心などを背景に、情報科学でこれまで培われてきた知見や技術は、近年様々な科学領域や産業・社会への展開が加速的に進むフェーズにあります。特に、機械学習は社会に急速に浸透しつつあるAI技術を支える最も主要な基盤的情報分野の一つとして広く認識されるようになり、高度化・多様化する情報インフラの更なる発展に不可欠な役割を担うようになりつつあります。","l":"https://mls.ist.osaka-u.ac.jp/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報システム工学専攻","n":"機械学習システム論講座","p":"池田正弘(准教授)","k":[],"t":"私は純粋数学、特に、自然現象を記述する非線形偏微分方程式を調和解析を用いて研究していて、その分野で博士(理学)の学位を取得しました。それと同時に、深層学習に基づく人工知能技術の目覚ましい発展を見聞きしない日は無く、自然と人工知能技術に興味を持ちました。","l":"https://mls.ist.osaka-u.ac.jp/index.html","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報システム工学専攻","n":"情報システム構成学講座","p":"谷口一徹(准教授)","k":["システムレベル設計方法論"],"t":"デジタルテレビやスマートフォン、自動車や航空機などに組み込まれ、特定の処理を行うコンピュータシステムを組込みシステム (Embedded System) と呼びます。これらの組込みシステムはそれぞれの用途に特化させることで低消費電力での動作や高い処理性能を実現していますが、そのための設計最適化技術が必要不可欠です。","l":"https://www.ist.osaka-u.ac.jp/japanese/researcher/detail.php?id=64","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報システム工学専攻","n":"知的集積システム講座","p":"三浦典之(教授)","k":["情報境界科学"],"t":"爆発的に進化したコンピュータの情報処理技術を駆使して現実の社会問題の解決策を提示する新しい社会が到来しようとしています。このためには、私たちの身体が存在する物理世界や心が存在する精神世界と情報世界の境界を融合していく必要があります。","l":"http://www-ise3.ist.osaka-u.ac.jp/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報システム工学専攻","n":"知的集積システム講座","p":"塩見準(准教授)","k":["低電力集積回路設計","新原理コンピューティング"],"t":"近い将来、人間とコンピュータが共生する超スマート社会の時代が到来します。ここで重要になるのが、省エネルギー・高性能なコンピュータの実現です。コンピュータのキーデバイスである集積回路の低電力化設計技術、および新奇デバイスに基づく新原理コンピューティング技術の研究を行っています。","l":"http://www-ise3.ist.osaka-u.ac.jp/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報システム工学専攻","n":"ディペンダビリティ工学講座","p":"土屋達弘(教授)","k":["ディペンダブルシステム"],"t":"ディペンダブルな、つまり、信頼のおける情報システムを実現するための技術について研究を行っています。システムの設計やプログラム中の誤りをコンピュータにより自動的に検出するモデルチェッキング技術や、システムの正しさを効率的にテストするためのテスト方法の開発などが具体的なテーマです。","l":"http://www-ise4.ist.osaka-u.ac.jp/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報システム工学専攻","n":"【協力講座】メディア統合環境講座［D3センター］","p":"浦西友樹(教授)","k":[],"t":"コンピュータビジョン、特にカメラから物体やシーンの3次元情報を計測する技術をベースに、拡張現実感やヒューマンコンピュータインタラクションの研究を行っています。シーンの幾何情報や光学的情報を実時間で計測し、拡張現実空間に反映させる研究や、投影型拡張現実技術の教育やスポーツトレーニング、医療分野への応用とその検証など、ヒトのために実環境で役立つ技術の確立を目指しています。","l":"https://www.ist.osaka-u.ac.jp/japanese/researcher/detail.php?id=76","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報システム工学専攻","n":"【協力講座】メディア統合環境講座［D3センター］","p":"白井詩沙香(准教授)","k":["ヒューマンコンピュータインタラクション","学習支援システム","教育工学","学習分析","情報科学教育"],"t":"AI、IoT、XR技術などを応用したヒューマン・コンピュータ・インタラクションに関する研究を行っています。特に、これらの技術を組み合わせた教育学習支援に興味があり、教育工学の知見をもとに、一人ひとりのニーズに寄り添った学習支援環境の創出を目指しています。","l":"https://www.ist.osaka-u.ac.jp/japanese/researcher/detail.php?id=79","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報システム工学専攻","n":"【協力講座】メディア統合環境講座［D3センター］","p":"千葉直也(准教授)","k":["三次元計測","三次元データ処理","三次元データ応用"],"t":"計測技術やデータ処理能力の発達により，計算機による三次元データの取得や処理が容易になり，三次元データの利用が広がっています．現実世界で計測されたデータは産業ロボットやXRデバイスに応用されており，他にも材料科学や計算力学などの分野でも三次元データが蓄積され，利用されています．現実世界での計測技術：カメラ，三次元センサ，触覚センサなどと，データ処理技術：画像処理，点群処理，深層学習，最適化アルゴリズムなどを軸に，三次元データをどのように計測・モデル化・応用するかについての研究に取り組んでいます．また，三次元データ処理技術を他の分野へ応用する研究として，材料科学における結晶構造を扱うニューラルネットワークの開発や，計算力学によるデータセット構築と3Dの生成モデルの学習などにも取り組んでいます．","l":"https://www.lab.ime.cmc.osaka-u.ac.jp/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報システム工学専攻","n":"【協力講座】メディア統合環境講座［D3センター］","p":"東田学(講師)","k":[],"t":"","l":"https://www.ist.osaka-u.ac.jp/japanese/researcher/detail.php?id=78","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報システム工学専攻","n":"【協力講座】知能データ科学講座［産業科学研究所］","p":"櫻井保志(教授)","k":["ビッグデータのためのリアルタイムAI基盤","IoTのためのリアルタイム予測・最適化"],"t":"自動車分野のコネクティッドカー・サービス、製造業におけるDX、デバイスや材料開発におけるマテリアルズインフォマティクスなど、産業や社会は大きく変化し、このような状況においてAIやビッグデータ解析は産業革命を支える技術として期待されています。","l":"https://www.dm.sanken.osaka-u.ac.jp/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報ネットワーク学専攻","n":"先進ネットワークアーキテクチャ講座","p":"小泉佑揮(教授)","k":["コンピューターネットワーク","インターネットアーキテクチャー","ネットワークセキュリティー"],"t":"現在、インターネットは単なるコンピューター同士を繋ぐネットワークを超え、私たちの生活に不可欠な社会基盤となっています。多種多様なアプリケーションがインターネット上に収容される中で、高速性のみならず、低遅延など、アプリケーション特有の多様な通信性能を満たすことが要求され、これに応えるべくインターネットは進化を続けています。","l":"http://www-hasegawa.ist.osaka-u.ac.jp/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報ネットワーク学専攻","n":"電脳物理ネットワーク学講座","p":"猿渡俊介(教授)","k":["物理空間と電脳空間の融合"],"t":"我々の生活する物理空間とコンピュータネットワークの織りなす電脳空間を融合することを目的として、次世代のコンピュータ、次世代のネットワークの研究を進めています。","l":"https://www-int.ist.osaka-u.ac.jp/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報ネットワーク学専攻","n":"電脳物理ネットワーク学講座","p":"藤橋卓也(准教授)","k":["超臨場感コミュニケーション","セマンティックコミュニケーション"],"t":"我々の物理空間と遠隔にある物理空間を円滑につなげることを目指して、取得した「その場」の情報を伝送する、超臨場感コンテンツのネットワーク伝送効率化に関する研究を進めています。","l":"https://www-int.ist.osaka-u.ac.jp/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報ネットワーク学専攻","n":"モバイルコンピューティング講座","p":"山口弘純(教授)","k":["サイバーフィジカルシステム","センシング","IoT","シミュレーション","モデリング","分散システム"],"t":"多様なセンサやデータを用いて私たちが暮らす実世界の人や車両、物体等をセンシングし、得られたデータを処理することにより、どこでどのような事象が生じているのか、人々はどのように行動しているのかを理解し、仮想世界に構築するセンシングとモデリング技術、ならびにその解析結果をフィードバックしより豊かなサービスを提供する技術を核とするサイバーフィジカルシステムに関する研究を中心に行っています。","l":"https://mc.net.ist.osaka-u.ac.jp/ja/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報ネットワーク学専攻","n":"モバイルコンピューティング講座","p":"内山彰(准教授)","k":["モバイルセンシング","IoT","ヘルスケア","無線センシング"],"t":"スマートフォン、ウェアラブルデバイスや環境に設置された様々なIoTデバイスから得られるセンサデータを利用して、人の行動や混雑などの環境の状態を推定し、便利・安心・安全な社会を実現するための研究を行っています。","l":"https://mc.net.ist.osaka-u.ac.jp/ja/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報ネットワーク学専攻","n":"モバイルコンピューティング講座","p":"Rizk Hamada(准教授)","k":["Pervasive Computing","AI system design","Smart Mobility","Spatial Intelligence"],"t":"","l":"https://mc.net.ist.osaka-u.ac.jp/ja/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報ネットワーク学専攻","n":"【協力講座】ユビキタスネットワーク講座［D3センター］","p":"下西英之(教授)","k":["Beyond 5G/6G通信","デジタルツイン"],"t":"2030年にはデジタルツインを用いて仮想世界と実世界が高度に融合し、人とロボットが自由に協働できる世界が期待されます。このようなデジタルツインを実現するためのネットワーク技術およびその応用に関する研究を行っています。","l":"https://www.ane.cmc.osaka-u.ac.jp/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報ネットワーク学専攻","n":"【協力講座】ユビキタスネットワーク講座［D3センター］","p":"大下裕一(准教授)","k":["機械学習／デジタルツイン処理基盤"],"t":"機械学習をはじめとする技術の進展により、現実世界をリアルタイムに反映したデジタルツインを構築し、デジタルツインを活用して現実世界の制御を行うシステムの研究が進められています。","l":"https://www.ane.cmc.osaka-u.ac.jp/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報ネットワーク学専攻","n":"【協力講座】セキュアプラットフォーム・アーキテクチャ講座［D3センター］","p":"猪俣敦夫(教授)","k":[],"t":"サイバーセキュリティ：私たちの社会基盤を取り巻くデータとそれを繋ぐネットワークをより良いものにする見えない魔法 かつてのコンピュータウィルスのようにネットワークを通じて拡散、増殖するものがサイバー世界の脅威に思われていた時代から大きく変化し、今やサイバーセキュリティの世界は単に計算機上の脅威だけを考えることでは解決は全くできないものとなっています。","l":"https://spa.d3c.osaka-u.ac.jp","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"情報ネットワーク学専攻","n":"【協力講座】セキュアプラットフォーム・アーキテクチャ講座［D3センター］","p":"大平健司(准教授)","k":[],"t":"現代社会に生きる我々は、数えきれないほど多くの情報システムに囲まれて生活をしています。本学の中だけでも、大阪大学総合情報通信システム(ODINS)、学務情報システム(KOAN)、授業支援システム(CLE)、電子メールサービス(OUMail)、キャンパスクラウド、それ以外にもたくさんあります。","l":"https://spa.d3c.osaka-u.ac.jp","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"マルチメディア工学専攻","n":"知能情報システム講座","p":"原隆浩(教授)","k":["データ工学","機械学習"],"t":"オンライン（サイバー）空間および実（リアル）空間において様々なサービスが運用され、ユーザやアイテム（商品や記事、店舗など）の情報やインタラクション（サービス履歴など）の情報がビッグデータとして生成されています。","l":"https://mmde-lab.github.io/webpage/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"マルチメディア工学専攻","n":"知能情報システム講座","p":"天方大地(准教授)","k":["データベース","データマイニング","機械学習のための高速アルゴリズム"],"t":"「ビッグデータ時代」と言われる現代、あらゆるモノがデータとして保存されており、その量は日々増加しています。そのようなデータの中から、必要なデータを効率よく検索する技術が求められており、検索速度の向上や有用な知識発見を目的としたデータ検索・データマイニング技術の研究を進めています。","l":"https://mmde-lab.github.io/webpage/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"マルチメディア工学専攻","n":"知能情報システム講座","p":"ZHANG YIHONG(准教授)","k":[],"t":"","l":"https://www.ist.osaka-u.ac.jp/japanese/researcher/detail.php?id=129","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"マルチメディア工学専攻","n":"暗号基盤講座","p":"五十部孝典(教授)","k":["暗号"],"t":"暗号は情報セキュリティの基盤技術であり、安全性を定量的に保証できるだけでなく、上位レイヤーの対策に依存せずに多様なセキュリティ課題を根本的に解決できる技術です。私は、暗号技術を核とした次世代のセキュリティ基盤の研究開発に取り組んでいます。","l":"https://www.crypt-sec.ist.osaka-u.ac.jp/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"マルチメディア工学専攻","n":"暗号基盤講座","p":"原啓祐(准教授)","k":[],"t":"","l":"https://www.ist.osaka-u.ac.jp/japanese/researcher/detail.php?id=210","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"マルチメディア工学専攻","n":"ビッグデータ工学講座","p":"鬼塚真(教授)","k":["ビッグデータ工学"],"t":"Data is the new oil (データは新しい石油である)という言葉に代表されるように、ビッグデータを処理することで知識やルールを発見して、社会的あるいは経済的なインパクトを 生み出すことが期待されています。","l":"http://www-bigdata.ist.osaka-u.ac.jp/ja/home/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"マルチメディア工学専攻","n":"ビッグデータ工学講座","p":"佐々木勇和(准教授)","k":["グラフデータ管理と分析","モバイル・時空間データ分析と管理"],"t":"グラフデータは、モノ間の関係性をモデル化することができ、様々な身近な応用に利用されています。例えば、モノとモノの関係性を知識グラフとして構造化することで、Web検索や商品の推薦システムに利用されています。","l":"http://www-bigdata.ist.osaka-u.ac.jp/ja/home/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"マルチメディア工学専攻","n":"実世界知能基盤講座","p":"前川卓也(教授)","k":["IoT","ウェアラブルセンシング","動物行動"],"t":"センサ技術の進展と共に、高機能携帯端末（スマートフォン）やゲーム機などにさまざまなセンサが搭載されるようになり、センサを用いて実世界現象を容易に捉えることができるようになってきました。 しかし、センサデータの多くは数値の系列データであり、センサデータを何らかの用途に用いるためには、そのデータを分析して人間が解釈できるような概念にまで抽象化する必要があります。","l":"https://realworld-ai.github.io/ja/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"マルチメディア工学専攻","n":"実世界知能基盤講座","p":"夏清心(講師)","k":["時系列データ解析"],"t":"私の研究は、時系列データ解析を基盤とし、人間や動物の複雑な行動変容を解明する技術開発に焦点を当てています。ウェアラブルデバイス等のセンシング技術を活用し、行動認識や動物の行動識別における高精度なフレームワークを構築しています。","l":"https://www.ist.osaka-u.ac.jp/japanese/researcher/detail.php?id=215","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"マルチメディア工学専攻","n":"脳情報インタラクション講座","p":"中野珠実(教授)","k":["認知神経科学"],"t":"情報化社会が進展するにつれて、多様な情報であふれる世界を人間がどのように捉え、行動を選択し、他者とコミュニケーションをとるかを明らかにすることの重要性が高まっています。そこで、われわれの研究グループでは、脳科学、生体情報科学、心理・行動実験を組み合わせることで、人間のもつ高度な認知機能を支える神経機構や、心が創発される仕組みを明らかにすることに取り組みます。","l":"https://www.ist.osaka-u.ac.jp/japanese/researcher/detail.php?id=147","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"マルチメディア工学専攻","n":"【協力講座】データ生成工学講座［D3センター］","p":"村田忠彦(教授)","k":["リアルスケール社会シミュレーション"],"t":"リアルスケール社会シミュレーション（RSSS: Real-Scale Social Simulation）とは、デジタルツインとしてサイバー空間で構築された仮想的な実社会をシミュレートする技術です。大規模高性能計算機を用いてRSSSを実現する技術を開発すると共に、公開された統計情報から模擬的に作成された合成人口データ（仮想個票データ）に生活行動データを加えた仮想実社会データの開発に取り組みます。","l":"https://www.ais.cmc.osaka-u.ac.jp/en/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"マルチメディア工学専攻","n":"【協力講座】データ生成工学講座［D3センター］","p":"李晨(准教授)","k":["生成AIを駆使した次世代創薬モデルの開発"],"t":"AIとバイオインフォマティクスの融合に基づく研究は、製薬開発における革新的な生成AIモデルの設計に注力しており、従来の製薬プロセスが抱える長期的な開発サイクルや高コストといった課題を克服するため、生成AI技術を駆使して分子設計と最適化を加速しています。","l":"https://www.lichen-lab.com/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"マルチメディア工学専攻","n":"【連携講座】マルチメディアエージェント講座［国際電気通信基礎技術研究所］","p":"萩田紀博(教授)","k":["サイバネティックアバター"],"t":"2020年～2030年、JSTムーンショット研究開発型研究開発事業：ムーンショット目標1「2050年までに人間が身体・脳・空間・時間の制約から解放される社会の実現」のプログラムディレクターを務める。誰もが複数の分身を遠隔操作できるサイバネテック・アバターシステムを開発することで、誰もが自らの能力を拡張し、仕事の生産性はもちろん、家事・育児・余暇など生活の豊かさを向上できる未来社会を実現する。","l":"https://www.ist.osaka-u.ac.jp/japanese/researcher/detail.php?id=151","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"マルチメディア工学専攻","n":"【連携講座】マルチメディアエージェント講座［国際電気通信基礎技術研究所］","p":"宮下敬宏(教授)","k":["アバター／ロボット情報流通基盤"],"t":"サイバネティックアバター、ネットワークロボット、センサネットワークに関する研究開発に取り組んでいます。サイバネティックアバターとは、人の分身（アバター）として遠隔操作するロボットやCGアバターと、それらを実現する人の身体・認知・知覚能力を拡張するICT／ロボット技術を含む概念です。","l":"https://www.ist.osaka-u.ac.jp/japanese/researcher/detail.php?id=152","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"マルチメディア工学専攻","n":"【連携講座】マルチメディアエージェント講座［国際電気通信基礎技術研究所］","p":"佐竹聡(准教授)","k":["ヒューマンロボットインタラクション"],"t":"少子高齢化に伴う人手不足が生じる中で、人々の日常生活で様々なサービスを行うロボットやサイバーエージェントが期待されています。しかし、ロボットやサイバーエージェントを我々の日常生活の中で共生させるには、様々なエージェントと人々の自然なやりとりを実現するヒューマンロボットインタラクションの研究が必要不可欠になります。","l":"https://www.ist.osaka-u.ac.jp/japanese/researcher/detail.php?id=153","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"バイオ情報工学専攻","n":"ゲノム情報工学講座","p":"瀬尾茂人(教授)","k":["バイオインフォマティクス"],"t":"技術の発展により生物のさまざまなデータが大量に取得されるようになってきています。それは例えばさまざまな条件下の細胞や組織における遺伝子の働き方を網羅的に調べたものであったり、生体内での細胞コミュニティのふるまいを長時間の動画として観察したものであったりします。","l":"http://www-gie.ist.osaka-u.ac.jp/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"バイオ情報工学専攻","n":"ゲノム情報工学講座","p":"松本悠希(准教授)","k":["バイオインフォマティクスの臨床応用"],"t":"次世代シーケンサー等の計測技術の飛躍的な発展により、臨床現場から得られる病原体のゲノムデータは膨大かつ複雑化しています。これらのデータを迅速かつ正確に解釈し、医療上の意思決定に役立てるためには、情報科学による高度な解析技術が必要不可欠です。","l":"https://www.ist.osaka-u.ac.jp/japanese/researcher/detail.php?id=221","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"バイオ情報工学専攻","n":"代謝情報工学講座","p":"清水浩(教授)","k":["代謝情報工学"],"t":"微生物を利用した物質生産のためのバイオプロセスは、環境負荷の低いプロセスとして、その重要性が高く認識されるようになってきています。ゲノム情報に基づくモデルを構築して代謝を目的物質生産のためにin silicoデザインする技術を開発しています。","l":"https://metabolic-engineering.jp/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"バイオ情報工学専攻","n":"代謝情報工学講座","p":"戸谷吉博(准教授)","k":["代謝情報工学"],"t":"持続可能な社会実現のため、微生物を利用して再生可能なバイオマス資源から様々な有用物質を生産する取り組みが注目されています。細胞に取り込まれた原料は、多段階の化学反応（代謝経路）を経て目的物質に変換されます。","l":"https://metabolic-engineering.jp/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"バイオ情報工学専攻","n":"バイオインスパイアードネットワーキング講座","p":"若宮直紀(教授)","k":["バイオ情報通信技術"],"t":"大規模化・複雑化の一途をたどっている情報通信システムが、今後も、安全、安心で快適な生活を支える社会インフラの一つであり続けるためには、取り巻く環境の変化に対して持続発展できるよう、従来とは異なる全く新しい情報通信技術（アルゴリズム・制御機構・アーキテクチャ・設計論）が必要です。","l":"https://www-waka.ist.osaka-u.ac.jp/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"バイオ情報工学専攻","n":"バイオインスパイアードネットワーキング講座","p":"黒川瞬(准教授)","k":[],"t":"経済学者は、複数個体の相互作用を分析するべく、ゲーム理論を開発しました。進化生物学者は、経済学分野からゲーム理論を輸入し、生物の行動の進化等を取り扱えるようにゲーム理論を改変し、進化ゲーム理論を開発しました。","l":"https://www.ist.osaka-u.ac.jp/japanese/researcher/detail.php?id=183","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"バイオ情報工学専攻","n":"バイオ情報計測学講座","p":"松田史生(教授)","k":["生物情報計測分析学"],"t":"生物のもつ代謝システムの動作原理を明らかにすることで、バイオ燃料などの有用物質を大量生産可能な微生物を作り出したり、植物がつくる多彩な二次代謝産物の多様性を捉えたり、人が病気になるメカニズムを解明したりすることを目指しています。","l":"http://www-symbio.ist.osaka-u.ac.jp/index.html","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"バイオ情報工学専攻","n":"バイオ情報計測学講座","p":"岡橋伸幸(准教授)","k":["生体分子情報計測"],"t":"細胞内にはDNA、タンパク質、代謝物などのたくさんの分子が存在しており、それらが互いに協調しあって一つの生物システムを構成しています。しかし、それらの分子がどのようなコンテキストにおいて、どのような役割を担っているかの多くは未解明です。","l":"http://www-symbio.ist.osaka-u.ac.jp/index.html","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"バイオ情報工学専攻","n":"人間情報工学講座","p":"前田太郎(教授)","k":[],"t":"バーチャルリアリティやテレイグジスタンス（遠隔臨場制御）のような没入体験によってわかるように人間の意識と世界は身体を介した情報によってのみ繋がっています。感覚と運動を電子情報的につなげるインタフェース技術を研究することによってヒトの知覚や運動のメカニズムを解明し、ヒト自身の身体機能を補佐し拡張する直観的で新しいインタフェース技術を開発する研究を進めています。","l":"http://www-hiel.ist.osaka-u.ac.jp/","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"バイオ情報工学専攻","n":"人間情報工学講座","p":"古川正紘(准教授)","k":["人間情報工学"],"t":"人の運動は、さまざまな感覚に基づいて実時間に決定されます。しかし、我々はその過程を意識することはありません。人間情報工学では主に心理物理学という手法を用い、人の感覚と運動の関係を計測することで現象を観測するとともに、数理的なモデルを当てはめることで現象を理解することを目指します。","l":"https://www.ist.osaka-u.ac.jp/japanese/researcher/detail.php?id=171","a":15,"w":"","c":"2026-10-06"},{"u":"大阪大学","d":"バイオ情報工学専攻","n":"人間情報工学講座","p":"近藤大祐(講師)","k":[],"t":"","l":"https://www.ist.osaka-u.ac.jp/japanese/researcher/detail.php?id=229","a":15,"w":"","c":"2026-10-06"},{"u":"筑波大学","d":"情報理工学位プログラム(数理情報工学)","n":"","p":"河辺徹","k":["制御デザイン"],"t":"制御デザイン：ロバスト制御、モデル予測制御、ハイブリッドシステム、ブレインマシンインターフェイスなどの理論とそれらの応用研究","l":"https://sites.google.com/view/tohrukawabe/","a":16,"w":"","c":"2026-10-06"},{"u":"筑波大学","d":"情報理工学位プログラム(数理情報工学)","n":"","p":"岸田昌子","k":["数理工学","制御理論","数理最適化"],"t":"数理工学、制御理論、数理最適化","l":"https://mkishida.github.io/index_jp.html","a":16,"w":"","c":"2026-10-06"},{"u":"筑波大学","d":"情報理工学位プログラム(数理情報工学)","n":"","p":"櫻井鉄也","k":["計算数学","コンピュータを利用するための数値数学","スーパーコンピュータのための並列コンピューティングアルゴリズム","大規模データ解析アルゴリズム","計算科学","数理ソフトウェア"],"t":"計算数学、コンピュータを利用するための数値数学、スーパーコンピュータのための並列コンピューティングアルゴリズム、大規模データ解析アルゴリズム、計算科学、数理ソフトウェア","l":"http://www.cs.tsukuba.ac.jp/~sakurai/index-j.html","a":16,"w":"","c":"2026-10-06"},{"u":"筑波大学","d":"情報理工学位プログラム(数理情報工学)","n":"物理情報システム研究室","p":"鹿野豊","k":["量子情報科学","計測学","計測システム","理論物理学"],"t":"量子情報科学、計測学、計測システム、理論物理学","l":"https://sites.google.com/view/pis-univ-tsukuba/","a":16,"w":"","c":"2026-10-06"} const STOP=/[のをにはがでとやもへ、。，．,.\s　]+|したい|している|ある|関心|興味|について|貢献|仕組み|学びたい|研究|ます|です|たい/g;

LABS.forEach(l=>{l._kw=l.k.map(norm);l._txt=norm(l.n+" "+l.t+" "+l.d+" "+l.p)});
const VOCAB=[...new Set(LABS.flatMap(l=>l._kw).filter(k=>k.length>=2))];

function terms(text){
  const t=norm(text);
  const out=new Set(t.split(STOP).filter(w=>w.length>=2));
  Object.keys(SYN).forEach(k=>{if(t.includes(norm(k)))out.add(norm(k))});
  VOCAB.forEach(k=>{if(t.includes(k))out.add(k)});
  return [...out];
}
function bigrams(s){const r=new Set();const c=s.replace(STOP,"");for(let i=0;i<c.length-1;i++)r.add(c.slice(i,i+2));return r}

function score(lab,ts,qgrams){
  let s=0;const hits=new Set();const via=new Set();
  ts.forEach(t=>{
    const syn=(SYN[Object.keys(SYN).find(k=>norm(k)===t)]||[]).map(norm);
    lab._kw.forEach((k,i)=>{
      if(k===t||k.includes(t)||t.includes(k)){s+=3;hits.add(lab.k[i])}
      else if(syn.some(a=>k.includes(a))){s+=2;hits.add(lab.k[i]);via.add(t)}
    });
    if(lab._txt.includes(t))s+=1.5;
    else if(syn.some(a=>lab._txt.includes(a))){s+=1;via.add(t)}
  });
  // 言い換えに強くするため，文字2連の重なりも少し加点する．
  let g=0;qgrams.forEach(b=>{if(lab._txt.includes(b))g++});
  s+=Math.min(g,12)*0.15;
  return {s,hits,via};
}

function fillSelect(id,values,label){
  $(id).innerHTML=`<option value="">${label}</option>`+values.map(v=>`<option>${esc(v)}</option>`).join("");
}
const UNIVS=[...new Set(LABS.map(l=>l.u))];
fillSelect("univ",UNIVS,"すべての大学");
function refreshDept(){
  const u=$("univ").value;
  fillSelect("dept",[...new Set(LABS.filter(l=>!u||l.u===u).map(l=>l.d))],"すべての専攻・コース");
}
refreshDept();
$("ex").innerHTML=EXAMPLES.map(e=>`<button type="button" class="chip">${esc(e)}</button>`).join("");
$("ex").addEventListener("click",e=>{if(e.target.matches(".chip")){$("q").value=e.target.textContent;shown=PAGE;render()}});
$("q").addEventListener("input",()=>{shown=PAGE;render()});
$("univ").addEventListener("input",()=>{refreshDept();shown=PAGE;render()});
$("dept").addEventListener("input",()=>{shown=PAGE;render()});
$("more").addEventListener("click",()=>{shown+=PAGE;render()});

function admHtml(l){
  const a=ADM[l.a]||{};
  if(!a.summary&&!a.url)return "";
  const row=(k,v)=>v?`<dt>${k}</dt><dd>${esc(v)}</dd>`:"";
  const url=safeUrl(a.url);
  return `<details class="adm"><summary>入試情報</summary><dl>${row("年度",a.year)}${row("形式・科目",a.summary)}${row("外部生",a.external)}${url?`<dt>出典</dt><dd><a href="${esc(url)}" target="_blank" rel="noopener">募集要項・入試案内</a></dd>`:""}</dl></details>`;
}

function render(){
  const q=$("q").value.trim(),ts=terms(q),qg=bigrams(norm(q));
  const u=$("univ").value,d=$("dept").value;
  let rows=LABS.filter(l=>(!u||l.u===u)&&(!d||l.d===d)).map(l=>({l,...score(l,ts,qg)}));
  if(q) rows=rows.filter(r=>r.s>=1).sort((p,r)=>r.s-p.s);
  const max=Math.max(1,...rows.map(r=>r.s));
  $("count").textContent=q
    ? `「${ts.slice(0,6).join(" / ")||q}」で ${rows.length} 件`
    : `全 ${rows.length} 件（興味を入力すると一致度順になります）`;
  if(!rows.length){$("list").innerHTML=`<li class="empty">一致する研究室がありません．別の言葉を試すか，大学や専攻の絞り込みを外してください．</li>`;$("more").hidden=true;return}
  $("list").innerHTML=rows.slice(0,shown).map(({l,s,hits,via})=>{
    const pct=Math.round(s/max*100),url=safeUrl(l.l);
    return `<li class="lab-item">
      <div class="score">${q?`<b>${pct}</b>一致度<div class="bar"><i style="width:${pct}%"></i></div>`:""}</div>
      <div>
        <h2>${esc(l.n||l.p||"（名称なし）")}</h2>
        <p class="meta">${esc(l.u)} ／ ${esc(l.d)}${l.p&&l.n?` ／ ${esc(l.p)}`:""}</p>
        ${q&&hits.size?`<p class="why">一致：${[...hits].map(esc).join("，")}${via.size?`（「${esc([...via].join("，"))}」から関連づけ）`:""}</p>`:""}
        ${l.t?`<p class="theme">${esc(l.t)}</p>`:""}
        <ul class="tags">${l.k.map((k,i)=>`<li class="${hits.has(k)?"hit":""}">${esc(k)}</li>`).join("")}</ul>
        ${l.w?`<p class="warn">注意：${esc(l.w)}</p>`:""}
        <p class="links">${url?`<a href="${esc(url)}" target="_blank" rel="noopener">研究室・教員ページ</a>`:""}<span>確認日 ${esc(l.c)}</span></p>
        ${admHtml(l)}
      </div></li>`}).join("");
  $("more").hidden=rows.length<=shown;
}
render();
</script>
